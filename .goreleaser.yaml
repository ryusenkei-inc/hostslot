# Release on a `v*` tag (.github/workflows/release.yaml): binaries for Linux, macOS and Windows
# The version comes from the tag through Go's VCS stamping (`hostslot version`), so no ldflags
version: 2
project_name: hostslot

builds:
  - main: ./cmd/hostslot
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # Reproducible: file times from the commit, not the build machine
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: archive
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
  # The bare executables, for installers that can't unpack archives (the Orca plugin)
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  # Squash-merged PR titles are the commit messages on main
  use: git
  sort: asc
