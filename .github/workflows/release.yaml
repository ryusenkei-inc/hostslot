# Release on a `v*` tag: test, then build and publish binaries with GoReleaser (.goreleaser.yaml)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog and Go's VCS stamping need the tags and history
      # Go version from go.mod
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      # The Orca plugin directory lists the newest vX.Y.Z tag with the version in orca-plugin.json
      - name: Plugin version matches the tag
        run: |
          version=$(node -p "require('./orca-plugin.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "orca-plugin.json has $version, the tag is $GITHUB_REF_NAME"; exit 1; }
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
