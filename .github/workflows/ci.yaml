# Checks on pushes to main and on pull requests. Each step has a name so a failed check is easy to find
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs the checks when the PR title changes
    types: [opened, synchronize, reopened, edited]

# A newer run on the same ref cancels the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan covers the whole history
      # Node.js for the dev tooling (mise.toml)
      - uses: jdx/mise-action@v4
      - uses: pnpm/action-setup@v6
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Prose lint
        run: pnpm lint:prose
      # The squash commit message on main is the PR title, which the local commit-msg hook never sees
      #   The title goes through an environment variable so it can't inject commands
      #   Dependabot PRs use fixed English titles and are skipped
      - name: PR title
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          pnpm exec prose-lint --commit-msg "$RUNNER_TEMP/title"
      # gitleaks-action needs a paid license for organizations, so run the official CLI image
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Go version from go.mod
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Cross-compile
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done
