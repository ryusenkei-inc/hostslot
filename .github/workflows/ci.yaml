# Checks on pushes to main and on pull requests. Each step has a name so a failed check is easy to find
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs the checks when the PR title changes
    types: [opened, synchronize, reopened, edited, ready_for_review]

# A newer run on the same ref cancels the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan covers the whole history
      # Node.js for apps/* and the dev tooling (mise.toml)
      - uses: jdx/mise-action@v5
      - uses: pnpm/action-setup@v6
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: TypeScript tests
        run: pnpm exec vitest run --passWithNoTests
      - name: Prose lint
        run: pnpm lint:prose
      # The squash commit message on main is the PR title, which the local commit-msg hook never sees
      #   The title goes through an environment variable so it can't inject commands
      #   Dependabot PRs use fixed English titles and are skipped
      - name: PR title
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          pnpm exec prose-lint --commit-msg "$RUNNER_TEMP/title"
      # gitleaks-action needs a paid license for organizations, so run the official CLI image
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose

  # vet, test on Linux, macOS and Windows, and builds for every GOOS/GOARCH in .goreleaser.yaml (shared workflow in toolkit)
  #   The defaults match this repository: Go from go.mod, ./..., the three OSes, and linux/darwin/windows × amd64/arm64
  go:
    uses: ryusenkei-inc/toolkit/.github/workflows/reusable-go.yaml@main
